<!DOCTYPE html>
<html>
<head>
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-page">
    <div class="dashboard">
        <header>
            STUDENT DASHBOARD
        </header>
        <aside>
            <h2>SIDEBAR</h2>
            <p>Home</p>
            <p>Courses</p>
            <p>Assignments</p>
            <p>Settings</p>
        </aside>
        <main>
            <h2>Learning Overview</h2>
            <div class="cards">
                <div class="card">
                    <h3>HTML</h3>
                    <p>7 Lessons</p>
                </div>
                <div class="card">
                    <h3>CSS</h3>
                    <p>08 Lessons</p>
                </div>
                <div class="card">
                    <h3>Projects</h3>
                    <p>4 Active</p>
                </div>
            </div>
            <p>Welcome to Student Dashboard!</p>
        </main>
        <footer>
            STUDENT LEARNING PORTAL
        </footer>
    </div>
</body>
</html>
